; Mypy configuration for Starship Battles
;
; PROJ-483 Phase 4: Adopt --strict on bounded Foundation layers.
; Heavy layers (game.simulation, game.strategy, game.ui) are explicitly
; deferred to a future dedicated project — see Projects/active_projects/PROJ-483
; (or archived_projects/ once closed).
[mypy]
follow_imports = silent

; PROJ-483 Phase 4 strict layers
[mypy-game.research.*]
strict = True

[mypy-game.services.*]
strict = True

[mypy-game.assets.*]
strict = True

[mypy-game.engine.*]
strict = True

[mypy-game.ai.*]
strict = True

[mypy-game.core.*]
strict = True

; Third-party stub gaps
[mypy-requests.*]
ignore_missing_imports = True
