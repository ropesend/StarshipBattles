# Repo-local Codex configuration for Starship Battles.
# User secrets and login state must stay outside the repo.

model = "gpt-5.4"
model_context_window = 1000000
model_auto_compact_token_limit = 950000
model_reasoning_effort = "xhigh"
personality = "pragmatic"
project_doc_max_bytes = 65536

# CLAUDE.md remains available as a fallback only if AGENTS.md is absent in a
# directory. AGENTS.md is the neutral shared entry point for this repo.
project_doc_fallback_filenames = ["CLAUDE.md"]

sandbox_mode = "workspace-write"
approval_policy = "on-request"
[windows]
sandbox = "unelevated"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[sandbox_workspace_write]
network_access = true
