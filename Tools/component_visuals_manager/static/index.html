<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarshipBattles | Component Visuals Manager</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="logo">StarshipBattles <span>Visuals Manager</span></div>
        <div class="controls">
            <input type="text" id="componentSearch" placeholder="Search Components (Name/ID)..." autocomplete="off">
            <button onclick="openNewTagDialog()" class="btn-primary">Add New Tag</button>
        </div>
        <div id="saveStatus" class="status-idle">Idle</div>
    </header>

    <main>
        <!-- Sidebar: Component List -->
        <section id="sidebar">
            <div class="panel-header">Components (<span id="compCount">0</span>)</div>
            <div id="componentList" class="scroll-v"></div>
        </section>

        <!-- Filters: Tag List -->
        <section id="filters">
            <div class="panel-header">Tag Filters</div>
            <div id="tagFilterList" class="scroll-v"></div>
            <div class="filter-legend">
                <div class="legend-item"><span class="dot include"></span> Include</div>
                <div class="legend-item"><span class="dot exclude"></span> Exclude</div>
                <div class="legend-item"><span class="dot ignore"></span> Ignore</div>
            </div>
        </section>

        <!-- Gallery: Image Grid -->
        <section id="gallery">
            <div class="panel-header">
                Image Gallery (<span id="imageCount">0</span>)
                <span id="galleryFilterInfo" class="filter-info"></span>
            </div>
            <div id="imageGrid" class="scroll-v"></div>
        </section>
    </main>

    <!-- Overlay: Selection Details -->
    <div id="selectionDetail" class="detail-panel hidden">
        <div class="detail-header">Asset Details</div>
        <div class="detail-content">
            <div class="asset-preview">
                <img id="detailImg" src="" alt="Preview">
                <div id="detailIndex">Index: --</div>
            </div>
            <div class="asset-metadata">
                <div class="meta-section">
                    <label>Tags Assigned:</label>
                    <div id="detailTags" class="tag-cloud"></div>
                </div>
                <div class="meta-section">
                    <label>Used by Components:</label>
                    <div id="detailUsage" class="usage-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal">
            <h3>Add New Global Tag</h3>
            <input type="text" id="newTagName" placeholder="Tag name (e.g. bio-organic)">
            <div class="modal-buttons">
                <button onclick="closeNewTagDialog()" class="btn-secondary">Cancel</button>
                <button onclick="addNewTag()" class="btn-primary">Create Tag</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
