<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Image Comparison</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #3d5afe;
            --restore-btn: #4caf50;
            --flag-btn: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pair-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .pair-card:hover {
            transform: translateY(-2px);
        }

        .pair-card.acted {
            opacity: 0.5;
            pointer-events: none;
        }

        .image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .image-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        img {
            width: 512px;
            height: 512px;
            object-fit: contain;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .bg-black {
            background: #000;
        }

        .bg-blue {
            background: #0000ff;
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filename {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .restore-btn {
            background-color: var(--restore-btn);
            color: white;
        }

        .restore-btn:hover {
            background-color: #45a049;
        }

        .flag-btn {
            background-color: var(--flag-btn);
            color: white;
        }

        .flag-btn:hover {
            background-color: #d32f2f;
        }

        #status-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #333;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Component Background Review</h1>
        <p>Compare original (left) with processed on Black and Blue backgrounds. Restore if the background removal was
            unnecessary, or Flag if it needs manual cleanup.</p>
    </header>

    <div class="container" id="image-list">
        <!-- Cards will be injected here -->
    </div>

    <div id="status-bar"></div>

    <script>
        const imageList = document.getElementById('image-list');
        const statusBar = document.getElementById('status-bar');

        function showStatus(msg) {
            statusBar.textContent = msg;
            statusBar.style.display = 'block';
            setTimeout(() => { statusBar.style.display = 'none'; }, 3000);
        }

        async function performAction(action, filename, cardId) {
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, filename })
                });
                const result = await response.json();
                if (result.success) {
                    showStatus(result.message);
                    document.getElementById(cardId).classList.add('acted');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
            }
        }

        async function loadImages() {
            try {
                const response = await fetch('/api/list');
                const pairs = await response.json();

                pairs.forEach((pair, index) => {
                    const cardId = `card-${index}`;
                    const card = document.createElement('div');
                    card.className = 'pair-card';
                    card.id = cardId;

                    const processedImgHtml = pair.processed ? `
                        <div class="image-container">
                            <span class="image-label">Processed (Black)</span>
                            <img src="/img/processed/${pair.processed}" class="bg-black" loading="lazy">
                        </div>
                        <div class="image-container">
                            <span class="image-label">Processed (Blue)</span>
                            <img src="/img/processed/${pair.processed}" class="bg-blue" loading="lazy">
                        </div>
                    ` : `
                        <div style="width:1024px; height:512px; display:flex; align-items:center; justify-content:center; background:#222; border:1px dashed #444;">
                            Missing Processed Image
                        </div>
                    `;

                    card.innerHTML = `
                        <div class="image-container">
                            <span class="image-label">Original (.jpg)</span>
                            <img src="/img/original/${pair.original}" class="bg-black" loading="lazy">
                        </div>
                        ${processedImgHtml}
                        <div class="info">
                            <div class="filename">${pair.original}</div>
                            <div class="controls">
                                <button class="restore-btn" onclick="performAction('restore', '${pair.original}', '${cardId}')">Restore Original</button>
                                <button class="flag-btn" onclick="performAction('flag', '${pair.original}', '${cardId}')">Flag for Review</button>
                            </div>
                        </div>
                    `;
                    imageList.appendChild(card);
                });
            } catch (err) {
                alert('Failed to load images: ' + err.message);
            }
        }

        loadImages();
    </script>
</body>

</html>
