<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Eraser | StarshipBattles Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 20, 0.9);
            --accent-color: #0088ff;
            --accent-glow: rgba(0, 136, 255, 0.3);
            --text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius: 12px;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        #top-bar {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        #top-bar h1 {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        #file-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Workspace */
        #workspace {
            flex: 1;
            display: flex;
            gap: 1px;
            background: var(--border-color);
            overflow: hidden;
        }

        .preview-panel {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s;
        }

        .panel-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 2px;
            color: #666;
            z-index: 10;
        }

        #panel-black { background: #000; }
        #panel-white { background: #fff; }

        .checkerboard {
            background-image: 
                linear-gradient(45deg, #eee 25%, transparent 25%), 
                linear-gradient(-45deg, #eee 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #eee 75%), 
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        canvas {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Controls Area */
        #controls-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(30px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            z-index: 200;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slider-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            font-weight: 800;
            color: #666;
            text-transform: uppercase;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .threshold-val {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-color);
            min-width: 40px;
            text-align: right;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: var(--accent-color); color: #fff; }
        .btn-primary:hover { 
            background: #0077ee; 
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        #loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-color);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        #loading-overlay.hidden { opacity: 0; }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="top-bar">
        <h1>Background <span style="color:var(--accent-color)">Eraser</span></h1>
        
        <div style="display:flex; gap:16px; align-items:center;">
            <label style="font-size:0.7rem; font-weight:800; color:#555">SOURCE ASSET</label>
            <select id="file-selector">
                <option value="">Loading assets...</option>
            </select>
        </div>
        
        <button class="btn btn-primary" onclick="downloadResult()">
            <i class="fas fa-download"></i> DOWNLOAD PNG
        </button>
    </div>

    <div id="workspace">
        <div class="preview-panel" id="panel-black">
            <div class="panel-label">On Black Background</div>
            <canvas id="canvas-black"></canvas>
        </div>
        <div class="preview-panel" id="panel-white">
            <div class="panel-label">On White Background</div>
            <canvas id="canvas-white"></canvas>
        </div>
    </div>

    <div id="controls-container">
        <div class="control-group">
            <div class="slider-wrap">
                <div class="slider-labels">
                    <span>Brightness Threshold</span>
                    <span id="threshold-display" class="threshold-val">10</span>
                </div>
                <input type="range" id="threshold-slider" min="0" max="255" value="10">
            </div>
            
            <div style="display:flex; gap:8px;">
                <button class="btn" style="background:rgba(255,255,255,0.05); color:#888;" onclick="toggleChecker()">
                    <i class="fas fa-chess-board"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvasBlack = document.getElementById('canvas-black');
        const canvasWhite = document.getElementById('canvas-white');
        const ctxBlack = canvasBlack.getContext('2d', { alpha: true });
        const ctxWhite = canvasWhite.getContext('2d', { alpha: true });
        
        const slider = document.getElementById('threshold-slider');
        const display = document.getElementById('threshold-display');
        const fileSelector = document.getElementById('file-selector');
        
        let sourceImg = new Image();
        let offscreenCanvas = document.createElement('canvas');
        let offscreenCtx = offscreenCanvas.getContext('2d');
        let imgData = null;
        let isProcessing = false;

        async function init() {
            // Load file list
            try {
                const resp = await fetch('/api/images');
                const files = await resp.json();
                fileSelector.innerHTML = files.map(f => `<option value="${f}">${f}</option>`).join('');
                
                // Set default to Background Stars.jpg if exists
                if (files.includes('Background Stars.jpg')) {
                    fileSelector.value = 'Background Stars.jpg';
                }
                
                if (fileSelector.value) loadImage(fileSelector.value);
            } catch (e) {
                console.error("Failed to load images", e);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        async function loadImage(filename) {
            const resp = await fetch(`/api/image/${filename}`);
            const json = await resp.json();
            sourceImg.onload = () => {
                // Resize all canvases
                canvasBlack.width = canvasWhite.width = offscreenCanvas.width = sourceImg.naturalWidth;
                canvasBlack.height = canvasWhite.height = offscreenCanvas.height = sourceImg.naturalHeight;
                
                // Get initial data
                offscreenCtx.drawImage(sourceImg, 0, 0);
                imgData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                
                process();
            };
            sourceImg.src = json.data;
        }

        function process() {
            if (!imgData || isProcessing) return;
            isProcessing = true;

            const threshold = parseInt(slider.value);
            display.textContent = threshold;

            // Create working copy
            const outData = new ImageData(
                new Uint8ClampedArray(imgData.data), 
                imgData.width, 
                imgData.height
            );
            const data = outData.data;

            // Binary thresholding loop
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Use simple brightness for background separation
                const brightness = (r + g + b) / 3;
                
                // Binary Mask (Above = Opaque, Below = Transparent)
                data[i + 3] = brightness >= threshold ? 255 : 0;
            }

            // Draw to both previews
            ctxBlack.putImageData(outData, 0, 0);
            ctxWhite.putImageData(outData, 0, 0);
            
            isProcessing = false;
        }

        function downloadResult() {
            const link = document.createElement('a');
            link.download = `eraser_result_${fileSelector.value.split('.')[0]}.png`;
            link.href = canvasBlack.toDataURL("image/png");
            link.click();
        }

        function toggleChecker() {
            document.getElementById('panel-white').classList.toggle('checkerboard');
        }

        slider.oninput = process;
        fileSelector.onchange = () => loadImage(fileSelector.value);

        // Interaction improvement: resize on window resize
        window.onresize = () => {
             // No need to resize internal buffer, CSS handles display sizing
        };

        init();
    </script>
</body>
</html>
