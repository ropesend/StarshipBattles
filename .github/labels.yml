# Declarative label set for the GitHub Issues tracking system.
#
# Apply via the helper script:
#   python Tools/agent_coordination/sync_github_labels.py
#
# Or one-shot via gh:
#   gh label create "type:bug" --color "d73a4a" --description "Defect" --force
#   ... (one line per label)
#
# Invariant per issue: exactly one type:*, one priority:*, one status:* label.
# Additional invariants for type:project parent issues:
#   exactly one proj-type:*, one source:*, one consult:*, one exec:*, one asset-state:*.
# Sub-issues (type:project-phase) carry exactly one phase:* in addition to the
# standard type/priority/status set.

- name: "type:bug"
  color: "d73a4a"
  description: "A defect — something is broken or behaves unexpectedly."
- name: "type:feature"
  color: "0e8a16"
  description: "New functionality or enhancement."
- name: "type:project"
  color: "1d76db"
  description: "Top-level multi-phase project issue (GP-<n>). Use the claude-gp-* skill family."
- name: "type:project-phase"
  color: "5dade2"
  description: "Sub-issue of a type:project parent representing one phase."

- name: "priority:critical"
  color: "b60205"
  description: "Blocks core gameplay or causes crashes."
- name: "priority:high"
  color: "d93f0b"
  description: "Significant feature broken / important impact."
- name: "priority:medium"
  color: "fbca04"
  description: "Minor feature issue or visual bug / nice-to-have."
- name: "priority:low"
  color: "c5def5"
  description: "Polish, QoL, minor enhancement."

- name: "status:pending"
  color: "ededed"
  description: "Awaiting work."
- name: "status:in-progress"
  color: "1d76db"
  description: "An agent is actively working on it."
- name: "status:awaiting-confirmation"
  color: "8a2be2"
  description: "Agent finished; awaiting user smoke + verification."
- name: "status:needs-clarification"
  color: "fbca04"
  description: "Blocked on the user answering questions."
- name: "status:deep-investigation"
  color: "5319e7"
  description: "Bug under deep investigation — root cause unclear."
- name: "status:needs-human-debug"
  color: "b60205"
  description: "Bug requires human reproduction or stepping through with breakpoints."
- name: "status:blocked"
  color: "000000"
  description: "Cannot progress until an external dependency resolves."
- name: "status:needs-refactor"
  color: "8b572a"
  description: "Feature blocked on a refactor that should ship first."
- name: "status:needs-project"
  color: "8b572a"
  description: "Feature scope warrants a PROJ-XX, not a single ticket."
- name: "status:analysis"
  color: "c5b3e7"
  description: "Feature requires upfront analysis before implementation."

- name: "status:planning"
  color: "c5def5"
  description: "Project under initial planning — design + plan draft in progress."
- name: "status:awaiting-audit"
  color: "8b572a"
  description: "Project implementation complete; post-completion audit pending."

- name: "proj-type:refactor"
  color: "fef2c0"
  description: "Project: refactor / restructuring."
- name: "proj-type:performance"
  color: "fbca04"
  description: "Project: performance optimization."
- name: "proj-type:feature"
  color: "0e8a16"
  description: "Project: large feature implementation."
- name: "proj-type:quality"
  color: "c2e0c6"
  description: "Project: quality / cleanup / tooling improvement."

- name: "phase:1"
  color: "e4e669"
  description: "Project phase 1."
- name: "phase:2"
  color: "e4e669"
  description: "Project phase 2."
- name: "phase:3"
  color: "e4e669"
  description: "Project phase 3."
- name: "phase:4"
  color: "e4e669"
  description: "Project phase 4."
- name: "phase:5"
  color: "e4e669"
  description: "Project phase 5."
- name: "phase:6"
  color: "e4e669"
  description: "Project phase 6."
- name: "phase:7"
  color: "e4e669"
  description: "Project phase 7."
- name: "phase:8"
  color: "e4e669"
  description: "Project phase 8."
- name: "phase:9"
  color: "e4e669"
  description: "Project phase 9."
- name: "phase:audit"
  color: "8b572a"
  description: "Terminal phase: post-completion audit."
- name: "phase:closed"
  color: "555555"
  description: "Terminal phase: project closed."

- name: "source:manual"
  color: "ededed"
  description: "Project created from a free-form description via /claude-gp-add."
- name: "source:triage"
  color: "fbca04"
  description: "Project created from a QA-triage item."
- name: "source:audit-shrink"
  color: "fef2c0"
  description: "Project created from an ocode-audit-shrink review."
- name: "source:audit-docs"
  color: "fef2c0"
  description: "Project created from an ocode-docs-audit review."
- name: "source:audit-error"
  color: "fef2c0"
  description: "Project created from an ocode-error-audit review."
- name: "source:audit-legacy"
  color: "fef2c0"
  description: "Project created from an ocode-legacy-audit review."
- name: "source:audit-pattern"
  color: "fef2c0"
  description: "Project created from an ocode-pattern-audit review."
- name: "source:audit-state"
  color: "fef2c0"
  description: "Project created from an ocode-state-audit review."
- name: "source:audit-test-review"
  color: "fef2c0"
  description: "Project created from an ocode-test-review report."
- name: "source:audit-testcoverage"
  color: "fef2c0"
  description: "Project created from an ocode-testcoverage-audit review."
- name: "source:audit-type"
  color: "fef2c0"
  description: "Project created from an ocode-type-audit review."
- name: "source:extract"
  color: "c5b3e7"
  description: "Project created by extracting a phase from another project."
- name: "source:revise"
  color: "c5b3e7"
  description: "Project created as a revision (added phases) of a closed project."

- name: "consult:pending"
  color: "ededed"
  description: "Codex consult on this project plan has not yet been performed."
- name: "consult:passed"
  color: "0e8a16"
  description: "Codex consult completed; feedback incorporated or explicitly rejected."
- name: "consult:overridden"
  color: "b60205"
  description: "User-authorized override: project created without a successful codex consult."
- name: "consult:failed"
  color: "d73a4a"
  description: "Codex consult attempted and failed (timeout/transport error). Resolve before proceeding."

- name: "exec:sequential"
  color: "1d76db"
  description: "Sequential execution mode — the only mode exercised in v1 of the GP system."
- name: "exec:phase-aware"
  color: "c5def5"
  description: "Phase-aware execution (03c equivalent). Reserved; not implemented in v1."
- name: "exec:parallel-eligible"
  color: "c5def5"
  description: "Inter-project parallel execution (03b equivalent). Reserved; not implemented in v1."

- name: "asset-state:pending"
  color: "fbca04"
  description: "tracking-assets/projects/GP-<n>/ commit has not yet landed. Idempotency-recovery scans this label."
- name: "asset-state:committed"
  color: "0e8a16"
  description: "tracking-assets/projects/GP-<n>/ committed; assets are durable."

- name: "verified"
  color: "0e8a16"
  description: "Applied by repo owner only — gates issue closure. Do not add manually if you are an agent."
