<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarshipBattles | Planet Feed QC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="header-content">
                <h1>Planet Feed <span>QC</span></h1>
                <div class="filter-controls">
                    <select id="typeFilter">
                        <option value="ALL">All Types (529)</option>
                        <option value="CONTINENTAL">Continental</option>
                        <option value="ARID">Arid</option>
                        <option value="PELAGIC">Pelagic</option>
                        <option value="MAGMA">Magma</option>
                        <option value="CRYOPLANET">Cryoplanet</option>
                        <option value="BARREN">Barren</option>
                        <option value="JOVIAN">Jovian</option>
                        <option value="ICE_GIANT">Ice Giant</option>
                        <option value="CHTHONIAN">Chthonian</option>
                        <option value="ICE_DWARF">Ice Dwarf</option>
                        <option value="PLANETOID">Planetoid</option>
                    </select>
                </div>
                <div id="stats" class="stats">
                    <!-- Stats will be injected here -->
                </div>
            </div>
        </header>

        <main id="feed" class="feed-container">
            <!-- Planet cards will be lazily loaded here -->
            <div class="loading-state">Initializing Planet Feed...</div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
